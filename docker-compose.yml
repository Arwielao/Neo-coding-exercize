version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_prod
    ports:
      - '5432:5432'

  api:
    build:
      context: ./api
      args:
        HUGGING_FACE_API_KEY: "${HUGGING_FACE_API_KEY}"
    image: myapp-api
    env_file: .env
    depends_on:
      - db
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    image: myapp-frontend
    ports:
      - '8080:80'
    depends_on:
      - api
    environment:
      - REACT_APP_API_URL=/api

  migrate:
    build:
      context: ./api
      target: builder
    image: myapp-api-migrator
    entrypoint: ["mix"]
    command: ["ecto.setup"]
    environment:
      MIX_ENV: "prod"
      DATABASE_URL: "ecto://postgres:postgres@db/api_prod"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    depends_on:
      - db

volumes:
  postgres_data: 